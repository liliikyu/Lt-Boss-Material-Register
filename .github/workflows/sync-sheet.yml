name: Sync Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (UTC)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build website data from Google Sheet
        run: python scripts/sync_sheet.py

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- assets/data.js; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js
          git commit -m "Sync dungeon data from Google Sheet"
          git push
