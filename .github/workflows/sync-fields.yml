name: Sync Fields Illustration Data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_fields.py"
      - ".github/workflows/sync-fields.yml"
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Fields data from Official La Tale Wiki
        run: python scripts/sync_fields.py
      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- assets/field-data.js; then
            echo "No Fields data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/field-data.js
          git commit -m "Sync Fields Illustration Book data"
          git push
