<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>LaTale Boss Material Register</title>
  <link rel="stylesheet" href="assets/styles.css?v=9">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#top" aria-label="LaTale Boss Material Register home">
        <span class="brand-mark">LT</span>
        <span>
          <strong>Boss Material Register</strong>
          <small>LaTale dungeon drops · Codex · Titles</small>
        </span>
      </a>
      <div class="topbar-actions">
        <span id="result-count" class="result-count">0 dungeons</span>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Theme: System. Click to switch theme." title="Theme: System">◐</button>
      </div>
    </div>
  </header>

  <main id="top" class="shell page">
    <section class="filter-panel" aria-label="Dungeon filters">
      <div class="filter-top">
        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" autocomplete="off" placeholder="Search dungeon or item…">
        </label>
        <button id="clear-filters" class="small-button" type="button">Reset</button>
      </div>

      <div class="range-row" id="range-filters">
        <label class="range-chip all-chip"><input type="checkbox" value="all" checked><span>All</span></label>
        <label class="range-chip"><input type="checkbox" value="lv-1-199"><span>Lv. 1 ~ 199</span></label>
        <label class="range-chip"><input type="checkbox" value="lv-200-235"><span>Lv. 200 ~ 235</span></label>
        <label class="range-chip"><input type="checkbox" value="ulv-1-1000"><span>ULv. 1 ~ ULv. 1000</span></label>
        <label class="range-chip"><input type="checkbox" value="ulv-1300-3500"><span>ULv. 1300 ~ ULv. 3500</span></label>
        <label class="range-chip"><input type="checkbox" value="ulv-3700-8000"><span>ULv. 3700 ~ ULv. 8000</span></label>
        <label class="range-chip"><input type="checkbox" value="ulv-8300-9999"><span>ULv. 8300 ~ ULv. 9999</span></label>
        <label class="range-chip"><input type="checkbox" value="slv-1-plus"><span>SLv. 1 ~</span></label>
      </div>

      <div class="legend" aria-label="Item labels">
        <span><i class="dot codex-dot"></i>Codex ✓</span>
        <span><i class="dot title-dot"></i>Title ✓</span>
        <span><i class="dot badge5-dot"></i>Badge 5 ✓</span>
        <span class="legend-consume"><span class="flag consume">Consume</span> Consumable</span>
        <span class="legend-note">Select multiple level ranges to combine them.</span>
      </div>
    </section>

    <section id="dungeon-grid" class="dungeon-grid" aria-live="polite"></section>
    <div id="empty-state" class="empty-state hidden">No dungeons match the current filters.</div>
  </main>

  <footer class="shell footer">Data synced from LT Boss Matts Tracker · Build v9 · Filters run entirely in your browser.</footer>
  <script src="assets/data.js?v=9"></script>
  <script src="assets/app.js?v=9"></script>
</body>
</html>
